<!DOCTYPE html>
<html lang="en-MU">

<head>
  <meta charset="UTF-8" />
  <title>Contact Us | Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- chome mobile panel color -->
  <meta name="theme-color" content="#ffc169" />
  <!-- favicon -->
  <link rel="shortcut icon" href="/img/ui/favicon.png" type="image/x-icon" />

  <link rel="stylesheet" href="/css/admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="container">
    <!-- HEADER -->
    <div class="header-bar">
      <div>
        <h1>Contact Us Dashboard</h1>
        <p class="subtitle">Manage and track customer inquiries</p>
      </div>

      <div class="header-actions">
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs-bar">
      <a href="/admin/contact/" class="tab-btn active contact-tab">
        Contact Us
      </a>
      <a href="/admin/callback/" class="tab-btn callback-tab"> Callback </a>
      <a href="/admin/notifications/" class="tab-btn"> Notifications </a>
      <a href="/admin/invoice/" class="tab-btn"> Invoice </a>
    </div>

    <!-- STATS -->
    <div class="stats">
      <div class="card">
        <label>Total Contacts</label>
        <strong id="totalContacts">0</strong>
      </div>
      <div class="card initiated-card">
        <label>Initiated</label>
        <strong id="initiatedCount">0</strong>
      </div>
      <div class="card pending-card">
        <label>Pending</label>
        <strong id="pendingCount">0</strong>
      </div>
      <div class="card progress-card">
        <label>In Progress</label>
        <strong id="inProgressCount">0</strong>
      </div>
      <div class="card completed-card">
        <label>Completed</label>
        <strong id="completedCount">0</strong>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-container">
      <div class="top-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search by name or email..." />
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="All">All</button>
          <button class="filter-btn" data-filter="Initiated">
            Initiated
          </button>
          <button class="filter-btn" data-filter="Pending">Pending</button>
          <button class="filter-btn" data-filter="In Progress">
            In Progress
          </button>
          <button class="filter-btn" data-filter="Completed">
            Completed
          </button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Contact Info</th>
            <th>Services</th>
            <th>Message</th>
            <th>Status</th>
            <th>Submitted</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="contactTableBody">
          <tr>
            <td colspan="6" class="loading">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="/js/admin-contact.js"></script>
</body>

</html>
