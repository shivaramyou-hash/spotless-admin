<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Callback Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="../css/admin.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <div class="container">
      <!-- HEADER -->
      <div class="header-bar">
        <div>
          <h1>Callback Requests</h1>
          <p class="subtitle">Manage customer callback requests</p>
        </div>

        <div class="header-actions">
          <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
      </div>

      <!-- TABS -->
      <div class="tabs-bar">
        <a href="./admin-contact.html" class="tab-btn contact-tab">
          Contact Us
        </a>
        <a href="./admin-callback.html" class="tab-btn active callback-tab">
          Callback
        </a>
        <a href="./admin-notifications.html" class="tab-btn"> Notifications </a>
      </div>

      <!-- TABS -->
      <div class="stats">
        <div class="card">
          <label>Total Contacts</label>
          <strong id="totalContacts">0</strong>
        </div>
        <div class="card initiated-card">
          <label>Initiated</label>
          <strong id="initiatedCount">0</strong>
        </div>
        <div class="card pending-card">
          <label>Pending</label>
          <strong id="pendingCount">0</strong>
        </div>
        <div class="card progress-card">
          <label>In Progress</label>
          <strong id="inProgressCount">0</strong>
        </div>
        <div class="card completed-card">
          <label>Completed</label>
          <strong id="completedCount">0</strong>
        </div>
      </div>

      <!-- TABLE -->
      <div class="table-container">
        <div class="top-bar">
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Search by name or phone..."
          />
          <div class="filter-buttons">
            <button class="filter-btn active" data-filter="All">All</button>
            <button class="filter-btn" data-filter="Initiated">
              Initiated
            </button>
            <button class="filter-btn" data-filter="Pending">Pending</button>
            <button class="filter-btn" data-filter="In Progress">
              In Progress
            </button>
            <button class="filter-btn" data-filter="Completed">
              Completed
            </button>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>Customer</th>
              <th>Phone</th>
              <th>Status</th>
              <th>Requested On</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="contactTableBody">
            <tr>
              <td colspan="6" class="loading">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script src="./js/admin-callback.js"></script>
  </body>
</html>
